name: CI/CD - Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

jobs:
  build:
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run type checking
      run: npm run build

    - name: Check if should create release
      id: check
      run: |
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "should_release=true" >> $GITHUB_OUTPUT
        else
          echo "should_release=false" >> $GITHUB_OUTPUT
        fi

    - name: Generate version
      id: version
      run: |
        # Get current version from package.json
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        
        # Generate new version based on trigger
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
        else
          RELEASE_TYPE="patch"
        fi
        
        # Calculate new version
        IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
        MAJOR=${VERSION_PARTS[0]}
        MINOR=${VERSION_PARTS[1]}
        PATCH=${VERSION_PARTS[2]}
        
        case $RELEASE_TYPE in
          "major")
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            ;;
          "minor")
            MINOR=$((MINOR + 1))
            PATCH=0
            ;;
          "patch")
            PATCH=$((PATCH + 1))
            ;;
        esac
        
        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        
        # Add timestamp for uniqueness
        TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
        BUILD_VERSION="$NEW_VERSION-build.$TIMESTAMP"
        
        echo "version=$BUILD_VERSION" >> $GITHUB_OUTPUT
        echo "release_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $BUILD_VERSION"

    - name: Update package.json version
      if: steps.check.outputs.should_release == 'true'
      run: |
        RELEASE_VERSION="${{ steps.version.outputs.release_version }}"
        npm version $RELEASE_VERSION --no-git-tag-version
        echo "Updated package.json to version $RELEASE_VERSION"

    - name: Build production
      run: npm run build

    - name: Create distribution package
      run: |
        # Create release directory
        mkdir -p release-package
        
        # Copy built files
        cp -r dist/ release-package/
        
        # Copy important files
        cp package.json release-package/
        cp README.md release-package/ 2>/dev/null || echo "README.md not found, skipping"
        cp LICENSE release-package/ 2>/dev/null || echo "LICENSE not found, skipping"
        
        # Create deployment guide
        cat > release-package/DEPLOYMENT.md << 'EOF'
        # Vue Dino Game - Deployment Guide
        
        This package contains the built Vue Dino Game ready for deployment.
        
        ## Contents
        - `dist/` - Built application files
        - `package.json` - Project metadata
        - `README.md` - Project documentation (if available)
        - `LICENSE` - License file (if available)
        
        ## Deployment Options
        
        ### 1. Static Web Server
        Upload the contents of the `dist/` folder to any static web server:
        - Apache HTTP Server
        - Nginx
        - GitHub Pages
        - Netlify
        - Vercel
        - AWS S3 + CloudFront
        
        ### 2. Local Testing
        You can test the built application locally by serving the `dist/` folder:
        ```bash
        # Using Python 3
        cd dist
        python -m http.server 8080
        
        # Using Node.js http-server
        npx http-server dist -p 8080
        
        # Using PHP
        cd dist
        php -S localhost:8080
        ```
        
        ### 3. Docker Deployment
        Create a simple Dockerfile:
        ```dockerfile
        FROM nginx:alpine
        COPY dist/ /usr/share/nginx/html/
        EXPOSE 80
        CMD ["nginx", "-g", "daemon off;"]
        ```
        
        ## Game Features
        - Chrome Dino game recreation in Vue 3
        - Responsive design for desktop and mobile
        - Touch and keyboard controls
        - Score tracking and high scores
        - Day/night mode toggle
        
        ## Browser Compatibility
        - Chrome/Chromium (recommended)
        - Firefox
        - Safari
        - Edge
        
        Built with Vue 3 + TypeScript + Vite
        EOF

    - name: Create ZIP package
      run: |
        cd release-package
        zip -r "../vue-dino-game-v${{ steps.version.outputs.version }}.zip" .
        cd ..
        ls -la *.zip

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vue-dino-build-${{ steps.version.outputs.version }}
        path: |
          vue-dino-game-v${{ steps.version.outputs.version }}.zip
          release-package/
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.should_release == 'true'
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: vue-dino-build-${{ needs.build.outputs.version }}

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ needs.build.outputs.version }}
        release_name: Vue Dino Game v${{ needs.build.outputs.version }}
        body: |
          ## Vue 3 Chrome Dino Game - Release v${{ needs.build.outputs.version }}
          
          ### 🎮 Game Features
          - **Authentic Chrome Dino Experience**: Faithful recreation of the beloved Chrome offline game
          - **Modern Vue 3 Implementation**: Built with Vue 3 Composition API and TypeScript
          - **Responsive Design**: Optimized for both desktop and mobile devices
          - **Pixel Art Graphics**: Custom pixel art character and environment
          - **Touch & Keyboard Controls**: Spacebar, Up Arrow, and touch support
          - **Score System**: Real-time scoring with high score persistence
          - **Day/Night Mode**: Dynamic theme switching
          - **Smooth Animations**: 60fps performance with HTML5 Canvas
          
          ### 🚀 Quick Start
          1. Download the `vue-dino-game-v${{ needs.build.outputs.version }}.zip` file
          2. Extract the ZIP file
          3. Upload the contents of the `dist/` folder to any web server
          4. Open `index.html` in a modern web browser
          5. Press spacebar or tap to start playing!
          
          ### 📋 What's Included
          - ✅ Built and optimized game files
          - ✅ Deployment guide with multiple hosting options
          - ✅ Docker deployment example
          - ✅ Local testing instructions
          - ✅ Browser compatibility information
          
          ### 🛠 Technical Details
          - **Framework**: Vue 3 with Composition API
          - **Language**: TypeScript with strict type checking
          - **Build Tool**: Vite for optimal performance
          - **Graphics**: HTML5 Canvas with custom rendering
          - **Styling**: Responsive CSS with mobile-first design
          
          ### 🌐 Deployment Options
          This release is ready for deployment on:
          - Static hosting services (Netlify, Vercel, GitHub Pages)
          - CDN platforms (AWS S3 + CloudFront, Azure Static Web Apps)
          - Traditional web servers (Apache, Nginx)
          - Container platforms (Docker, Kubernetes)
          
          ### 📱 Browser Support
          - ✅ Chrome/Chromium (recommended)
          - ✅ Firefox
          - ✅ Safari
          - ✅ Microsoft Edge
          - ✅ Mobile browsers (iOS Safari, Chrome Mobile)
          
          ---
          
          **Built on**: ${{ github.run_id }}
          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}
          
          Ready to play? Download and deploy now! 🦕🎮
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./vue-dino-game-v${{ needs.build.outputs.version }}.zip
        asset_name: vue-dino-game-v${{ needs.build.outputs.version }}.zip
        asset_content_type: application/zip

    - name: Create latest release link
      run: |
        echo "🎉 Release created successfully!"
        echo "📦 Download URL: ${{ steps.create_release.outputs.html_url }}"
        echo "🏷️ Tag: v${{ needs.build.outputs.version }}"
        echo "📱 ZIP File: vue-dino-game-v${{ needs.build.outputs.version }}.zip"

  notify:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: always() && needs.build.outputs.should_release == 'true'
    
    steps:
    - name: Notification
      run: |
        if [[ "${{ needs.release.result }}" == "success" ]]; then
          echo "✅ CI/CD Pipeline completed successfully!"
          echo "🚀 New release v${{ needs.build.outputs.version }} is now available"
          echo "📦 Download the game at: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.build.outputs.version }}"
        else
          echo "❌ CI/CD Pipeline failed during release creation"
          echo "✅ Build was successful, but release failed"
        fi